# Pruebas de cada cambio y control del flujo de ramas (docs/devops.md).
# Hoy «pruebas» corre la revisión previa (scripts/preflight.sh). Las pruebas de
# la base, del backend y de aceptación se suman a este mismo job cuando existan,
# para que el check requerido por la protección de ramas siga llamándose igual.
# No usa acciones ni imágenes de Redgate mientras su licencia esté en revisión.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Prueba de la revisión previa y del hook de memoria (casos que deben pasar y que deben fallar)
        run: bash scripts/probar_preflight.sh
      - name: Revisión previa (datos inventados, secretos y memoria)
        # Los PR de Dependabot no escriben MEMORIA.md; se revisa el repositorio completo y la
        # actualización queda registrada en la memoria con el siguiente cambio (docs/devops.md).
        env:
          EVENTO: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          AUTOR: ${{ github.actor }}
        run: |
          if [ "$EVENTO" = "pull_request" ] && [ "$AUTOR" != "dependabot[bot]" ]; then
            bash scripts/preflight.sh --pr "origin/$BASE_REF"
          else
            bash scripts/preflight.sh
          fi

  # Secretos en todo el historial con gitleaks, fijado por versión y suma SHA-256. Hoy es un check
  # informativo; pasa a requerido cuando se confirme que no da falsos positivos (docs/devops.md).
  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks 8.30.1 sobre el historial
        run: |
          # --proto =https impide que una redirección lleve la descarga a HTTP (hallazgo de SonarQube Cloud).
          curl --proto '=https' --tlsv1.2 -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --config .gitleaks.toml --redact --no-banner --verbose .

  # main solo recibe versiones (desde develop) o arreglos urgentes (hotfix/*).
  flujo:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Rama de origen permitida
        env:
          ORIGEN: ${{ github.head_ref }}
        run: |
          case "$ORIGEN" in
            develop|hotfix/*) echo "PR a main desde $ORIGEN: permitido" ;;
            *) echo "::error::Un PR a main solo puede salir de develop o de hotfix/*, no de $ORIGEN"; exit 1 ;;
          esac
