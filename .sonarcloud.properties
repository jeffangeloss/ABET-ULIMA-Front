# Análisis automático de SonarQube Cloud (docs/devops.md, sección «SonarQube Cloud, Snyk y secretos»).
#
# El plan gratuito admite repos privados hasta 50 000 líneas por organización y solo analiza la
# rama principal y los PR hacia ella. Por eso, en la consola de SonarQube Cloud, la rama principal
# del proyecto se cambia a develop. Quedan fuera los datos inventados de prueba, la documentación,
# la configuración de agentes y los scripts de shell, que no llegan al navegador.
#
# Cuando haya pruebas con cobertura, el análisis pasa a la CI (sonar-project.properties con la
# cobertura lcov de Vitest, la acción oficial fijada por SHA y el secreto SONAR_TOKEN) y se apaga
# el análisis automático en la consola.
sonar.exclusions=tests/datos_inventados/**,docs/**,.claude/**,scripts/**
