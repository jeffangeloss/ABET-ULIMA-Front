# Al llegar a main una versión de VERSION que todavía no tiene tag, crea el tag
# vX.Y.Z y el Release de GitHub con su sección del CHANGELOG.md (docs/devops.md).
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Crear el tag y el Release si la versión es nueva
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::VERSION debe tener la forma X.Y.Z y tiene «$VERSION»"
            exit 1
          fi
          if [ "$VERSION" = "0.0.0" ]; then
            echo "Versión 0.0.0: todavía no hay nada que publicar"
            exit 0
          fi
          TAG="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "$TAG ya existe: nada que publicar"
            exit 0
          fi
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { dentro = 1; next }
            dentro && /^## \[/ { exit }
            dentro { print }
          ' CHANGELOG.md > notas.md
          if [ ! -s notas.md ]; then
            echo "::error::CHANGELOG.md no tiene la sección [$VERSION]"
            exit 1
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Versión $VERSION" --notes-file notas.md
